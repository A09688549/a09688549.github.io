<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Moss SMP, sezona 2</title>
<style>
  :root { --bg: #ffffff; --fg: #1d2330; --muted: #5b6577; --panel: #f5f6f8; --line: #dde1e7; --accent: #2f8f5b; --bad: #b3261e; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14171d; --fg: #e8ebf0; --muted: #a0a9b8; --panel: #1c2028; --line: #2f3541; --accent: #43b97f; --bad: #ff8a80; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #14171d; --fg: #e8ebf0; --muted: #a0a9b8; --panel: #1c2028; --line: #2f3541; --accent: #43b97f; --bad: #ff8a80; color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #gate { min-height: 100%; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  form { width: min(100%, 22rem); display: flex; flex-direction: column; gap: .9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1.5rem; }
  h1 { font: 400 1.6rem/1.15 Georgia, "Times New Roman", serif; margin: 0; }
  p { margin: 0; color: var(--muted); }
  label { display: flex; flex-direction: column; gap: .3rem; font-size: .85rem; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: .5rem; color: var(--fg); }
  input { font: inherit; padding: .55rem .65rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  input[type="checkbox"] { padding: 0; width: 1.05rem; height: 1.05rem; accent-color: var(--accent); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; padding: .6rem; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: progress; }
  #msg { min-height: 1.3em; color: var(--bad); font-size: .85rem; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  #out { position: fixed; top: max(.4rem, env(safe-area-inset-top, 0px)); right: max(.5rem, env(safe-area-inset-right, 0px)); z-index: 5; padding: .25rem .6rem; font-size: .75rem; font-weight: 500;
    background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 99px; opacity: .85; }
  #out:hover, #out:focus-visible { opacity: 1; color: var(--fg); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="gate">
  <form id="f" autocomplete="on">
    <h1>Moss SMP, sezona 2</h1>
    <p>Pristup samo uz prijavu.</p>
    <label for="u">Korisničko ime<input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label for="p">Lozinka<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <label class="check" for="r"><input id="r" type="checkbox" checked>Zapamti me na ovom uređaju (90 dana)</label>
    <button id="go" type="submit">Prijavi se</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<iframe id="app" title="Pregled napretka" hidden sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
<button id="out" type="button" hidden>Odjava</button>
<script>
(function () {
  var enc = new TextEncoder();
  var subtle = window.crypto && window.crypto.subtle;
  var KEEP_DAYS = 90;
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function hex(u8) { return Array.prototype.map.call(u8, function (b) { return b.toString(16).padStart(2, '0'); }).join(''); }
  function concat() { var parts = Array.prototype.slice.call(arguments); var o = new Uint8Array(parts.reduce(function (n, x) { return n + x.length; }, 0)); var i = 0; parts.forEach(function (x) { o.set(x, i); i += x.length; }); return o; }
  async function macOk(macKey, data, tag) { var k = await subtle.importKey('raw', macKey, { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']); return subtle.verify('HMAC', k, tag, data); }
  async function cbcDecrypt(key, iv, ct) { var k = await subtle.importKey('raw', key, 'AES-CBC', false, ['decrypt']); return new Uint8Array(await subtle.decrypt({ name: 'AES-CBC', iv: iv }, k, ct)); }

  // Remembered login: the two content keys are kept in this browser as NON-extractable CryptoKey objects
  // (IndexedDB). Scripts can use them to open this page but nobody can read the key bytes or the password.
  function idb() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('moss-site', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('k'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  async function idbPut(value) { var db = await idb(); return new Promise(function (res, rej) { var t = db.transaction('k', 'readwrite'); t.objectStore('k').put(value, 'keys'); t.oncomplete = res; t.onerror = function () { rej(t.error); }; }); }
  async function idbGet() { var db = await idb(); return new Promise(function (res, rej) { var q = db.transaction('k', 'readonly').objectStore('k').get('keys'); q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(q.error); }; }); }
  async function idbDel() { var db = await idb(); return new Promise(function (res) { var t = db.transaction('k', 'readwrite'); t.objectStore('k').delete('keys'); t.oncomplete = res; t.onerror = res; }); }
  async function forget() { try { await idbDel(); } catch (e) { /* nothing stored */ } try { localStorage.removeItem('moss-keys'); sessionStorage.removeItem('moss-keys'); } catch (e) { /* no storage */ } }

  async function openWith(blob, encKey, macKey) {
    var iv = b64(blob.iv), ct = b64(blob.ct), tag = b64(blob.tag);
    if (!(await subtle.verify('HMAC', macKey, tag, concat(iv, ct)))) throw new Error('mac');
    return new TextDecoder().decode(new Uint8Array(await subtle.decrypt({ name: 'AES-CBC', iv: iv }, encKey, ct)));
  }
  function show(html) {
    var app = document.getElementById('app');
    app.srcdoc = html;
    app.hidden = false;
    document.getElementById('out').hidden = false;
    document.getElementById('gate').hidden = true;
  }
  async function login(blob, user, password, remember) {
    var name = user.trim().toLowerCase();
    var hint = hex(new Uint8Array(await subtle.digest('SHA-256', enc.encode('login:' + name))).slice(0, 4));
    var w = blob.users.find(function (x) { return x.hint === hint; });
    var salt = w ? b64(w.salt) : new Uint8Array(16);
    var base = await subtle.importKey('raw', enc.encode(name + '\n' + password), 'PBKDF2', false, ['deriveBits']);
    var bits = new Uint8Array(await subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: blob.iter }, base, 512));
    if (!w) throw new Error('user');
    var iv = b64(w.iv), ct = b64(w.ct), tag = b64(w.tag);
    if (!(await macOk(bits.slice(32), concat(iv, ct), tag))) throw new Error('password');
    var keys = await cbcDecrypt(bits.slice(0, 32), iv, ct);
    var encKey = await subtle.importKey('raw', keys.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    var macKey = await subtle.importKey('raw', keys.slice(32, 64), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    var html = await openWith(blob, encKey, macKey);
    if (remember) { try { await idbPut({ enc: encKey, mac: macKey, at: Date.now() }); } catch (e) { /* the page still opens, it just will not be remembered */ } }
    return html;
  }

  var form = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
  var blobPromise = fetch('blob.json', { cache: 'no-store' }).then(function (r) { return r.json(); });
  if (!subtle) { msg.textContent = 'Ovaj browser ne podržava potrebnu zaštitu. Otvori stranicu preko https.'; go.disabled = true; }

  // Remembered on this device: open straight away; if the keys no longer fit (new logins) or are too old, ask again.
  blobPromise.then(async function (blob) {
    try {
      var saved = await idbGet();
      if (!saved) return;
      if (Date.now() - saved.at > KEEP_DAYS * 86400000) { await forget(); return; }
      show(await openWith(blob, saved.enc, saved.mac));
    } catch (e) { await forget(); }
  }).catch(function () {});

  document.getElementById('out').addEventListener('click', async function () { await forget(); location.reload(); });

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    msg.textContent = '';
    go.disabled = true;
    go.textContent = 'Provera...';
    try {
      var blob = await blobPromise;
      show(await login(blob, document.getElementById('u').value, document.getElementById('p').value, document.getElementById('r').checked));
    } catch (e) {
      msg.textContent = 'Pogrešno korisničko ime ili lozinka.';
    } finally {
      go.disabled = false;
      go.textContent = 'Prijavi se';
    }
  });
})();
</script>
</body>
</html>
